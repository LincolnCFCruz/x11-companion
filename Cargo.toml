[workspace]
members = ["crates/core", "crates/cli", "app/src-tauri"]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
authors = ["Lincoln Cruz <lincolncfcruz@outlook.com>"]
rust-version = "1.85"

[workspace.dependencies]
attack-shark-x11 = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
